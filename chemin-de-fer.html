<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Chemin de fer — Exposition Rolex × François Peyranne</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f4f6f8; color: #0b1116;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding: 44px 36px 80px; -webkit-font-smoothing: antialiased;
  }
  header { text-align: center; margin-bottom: 34px; }
  h1 { font-size: 21px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; }
  .sub { margin-top: 10px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #6b7280; }

  /* Storyboard : une rangée par salle (début → fin) */
  .strip { max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .room {
    background: #fff; border-radius: 10px; padding: 16px 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.07);
    display: grid; grid-template-columns: 200px 1fr 1fr; gap: 18px; align-items: center;
  }
  .room.dark { background: #14181c; color: #e8eef2; }
  .label { }
  .label .step { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .label .name { font-size: 13px; font-weight: 600; margin-top: 4px; }
  .label .salle { font-size: 11px; color: #9aa3ad; margin-top: 6px; }
  .label .amb { display:inline-flex; align-items:center; gap:6px; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; margin-top:10px; color:#9aa3ad; }
  .label .amb i { width:10px;height:10px;border-radius:50%; border:1px solid rgba(128,128,128,0.4); display:inline-block; }
  .shot { display:flex; flex-direction:column; }
  .shot .cap { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#9aa3ad; margin-bottom:6px; }
  .room.dark .shot .cap { color:#7d8893; }
  .frame { position:relative; aspect-ratio:16/9; background:#222; border-radius:6px; overflow:hidden; }
  .frame img { width:100%; height:100%; object-fit:cover; display:block; }
  a.open { text-decoration:none; color:inherit; }
  footer { text-align:center; margin-top: 42px; font-size: 11px; color:#9aa3ad; letter-spacing:0.1em; }
  @media print {
    body { background:#fff; padding:14px; }
    .room { box-shadow:none; border:1px solid #e5e7eb; break-inside:avoid; }
    .room.dark { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
</head>
<body>
  <header>
    <h1>Chemin de fer — The Rolex Crown Exhibition</h1>
    <div class="sub">Parcours : 1 · 8 · 3 │ 4 · 5 · 7 │ 6 · 2 · 9 — début → fin de chaque salle</div>
  </header>

  <div class="strip" id="strip"></div>
  <footer>Lis de haut en bas : la FIN d'une salle puis le DÉBUT de la suivante = le raccord de chromie · Cmd+P pour PDF</footer>

  <script>
    function pad(n){ return String(n).padStart(3,'0'); }
    // Parcours : step, salle d'origine, fichier, dossier frames, frame début, frame fin, ambiance
    var ROOMS = [
      { step:1, salle:1, file:'variations-expo.html', dir:'FRAMES_INTRO2',  d:1,  f:143, amb:'clair',  name:'Intro Couronne + Tryptique 003' },
      { step:2, salle:8, file:'salle-8.html',        dir:'FRAMES_SALLE8',  d:1,  f:121, amb:'clair',  name:'Sport' },
      { step:3, salle:3, file:'salle-3.html',        dir:'FRAMES_SALLE3',  d:13, f:71,  amb:'clair',  name:'Dyptique 006' },
      { step:4, salle:4, file:'salle-4.html',        dir:'FRAMES_SALLE4',  d:1,  f:121, amb:'sombre', name:'Swiss Made / Perpetual Planet' },
      { step:5, salle:5, file:'salle-5.html',        dir:'FRAMES_SALLE5',  d:1,  f:121, amb:'sombre', name:'Datejust / Submariner / Tennis' },
      { step:6, salle:7, file:'salle-7.html',        dir:'FRAMES_SALLE7',  d:1,  f:121, amb:'sombre', name:'Techno' },
      { step:7, salle:6, file:'salle-6.html',        dir:'FRAMES_SALLE6',  d:1,  f:97,  amb:'clair',  name:'Musique — 4 affiches' },
      { step:8, salle:2, file:'salle-2.html',        dir:'FRAMES_SALLE2',  d:31, f:121, amb:'clair',  name:'Tryptique 003' },
      { step:9, salle:9, file:'salle-9.html',        dir:'FRAMES_SALLE9',  d:1,  f:121, amb:'clair',  name:'Milgauss' }
    ];
    var strip = document.getElementById('strip');
    ROOMS.forEach(function(r){
      var dot = r.amb==='sombre' ? '#14181c' : '#e7ebf0';
      var row = document.createElement('a');
      row.className = 'room' + (r.amb==='sombre'?' dark':''); row.href = r.file;
      row.classList.add('open');
      row.innerHTML =
        '<div class="label"><div class="step">'+r.step+'</div><div class="name">'+r.name+'</div>'+
          '<div class="salle">salle d\'origine n°'+r.salle+'</div>'+
          '<div class="amb"><i style="background:'+dot+'"></i>'+r.amb+'</div></div>'+
        '<div class="shot"><div class="cap">Début</div><div class="frame"><img loading="lazy" src="'+r.dir+'/frame_'+pad(r.d)+'.jpg"></div></div>'+
        '<div class="shot"><div class="cap">Fin</div><div class="frame"><img loading="lazy" src="'+r.dir+'/frame_'+pad(r.f)+'.jpg"></div></div>';
      strip.appendChild(row);
    });
  </script>
</body>
</html>
