<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test — Lightbox zoom scroll</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #111;
    font-family: -apple-system, sans-serif;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    gap: 20px;
  }

  h1 { font-size: 14px; letter-spacing: .2em; opacity: .4; text-transform: uppercase; }

  .grid {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .thumb {
    width: 200px;
    height: 280px;
    object-fit: cover;
    cursor: zoom-in;
    opacity: .85;
    transition: opacity .2s;
  }
  .thumb:hover { opacity: 1; }

  /* ── Lightbox overlay ── */
  #lb {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 1000;
    overflow: hidden;
    cursor: zoom-in;
  }
  #lb.open { display: flex; align-items: center; justify-content: center; }

  /* conteneur pannable/zoomable */
  #lb-stage {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
    will-change: transform;
    user-select: none;
  }

  #lb-img {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    pointer-events: none;
    display: block;
    border: none;
    outline: none;
  }

  /* Boutons nav */
  .lb-nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,.08);
    border: none;
    color: #fff;
    font-size: 28px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 1001;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }
  .lb-nav:hover { background: rgba(255,255,255,.18); }
  #lb-prev { left: 16px; }
  #lb-next { right: 16px; }

  /* Bouton fermer */
  #lb-close {
    position: fixed;
    top: 16px;
    right: 20px;
    background: none;
    border: none;
    color: rgba(255,255,255,.5);
    font-size: 28px;
    cursor: pointer;
    z-index: 1001;
    line-height: 1;
    transition: color .15s;
  }
  #lb-close:hover { color: #fff; }

  /* Indicateur zoom */
  #lb-zoom-hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: .12em;
    color: rgba(255,255,255,.3);
    pointer-events: none;
    z-index: 1001;
    text-transform: uppercase;
    transition: opacity .3s;
  }
</style>
</head>
<body>

<h1>Test lightbox — zoom au scroll</h1>

<div class="grid">
  <img class="thumb" src="AFFICHES_JPEG_SITE/DYPTIQUE_001_HD_A.webp" data-idx="0" />
  <img class="thumb" src="AFFICHES_JPEG_SITE/DYPTIQUE_001_HD_B.webp" data-idx="1" />
  <img class="thumb" src="AFFICHES_JPEG_SITE/DYPTIQUE_002_HD_A.webp" data-idx="2" />
  <img class="thumb" src="AFFICHES_JPEG_SITE/DYPTIQUE_002_HD_B.webp" data-idx="3" />
  <img class="thumb" src="AFFICHES_JPEG_SITE/TRYPTIQUE_003_HD_A.webp" data-idx="4" />
  <img class="thumb" src="AFFICHES_JPEG_SITE/TRYPTIQUE_003_HD_B.webp" data-idx="5" />
  <img class="thumb" src="AFFICHES_JPEG_SITE/TRYPTIQUE_003_HD_C.webp" data-idx="6" />
</div>

<!-- Lightbox -->
<div id="lb">
  <div id="lb-stage">
    <img id="lb-img" src="" alt="" />
  </div>
  <button class="lb-nav" id="lb-prev">&#8249;</button>
  <button class="lb-nav" id="lb-next">&#8250;</button>
  <button id="lb-close">&#10005;</button>
  <div id="lb-zoom-hint">Scroll to zoom · Drag to pan</div>
</div>

<script>
  const ZOOM_MIN = 1;
  const ZOOM_MAX = 6;
  const ZOOM_STEP = 0.12; // sensibilité scroll

  const thumbs = Array.from(document.querySelectorAll('.thumb'));
  const lb      = document.getElementById('lb');
  const stage   = document.getElementById('lb-stage');
  const img     = document.getElementById('lb-img');
  const btnPrev = document.getElementById('lb-prev');
  const btnNext = document.getElementById('lb-next');
  const btnClose= document.getElementById('lb-close');
  const hint    = document.getElementById('lb-zoom-hint');

  let currentIdx = 0;
  let scale = 1;
  let tx = 0, ty = 0; // translation en px
  let dragging = false;
  let dragStart = { x: 0, y: 0 };
  let dragOrigin = { tx: 0, ty: 0 };
  let hintTimer = null;

  function applyTransform() {
    stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    lb.style.cursor = scale > 1 ? (dragging ? 'grabbing' : 'grab') : 'zoom-in';
  }

  function resetTransform() {
    scale = 1; tx = 0; ty = 0;
    applyTransform();
  }

  function clampTranslation() {
    // Calcule les limites de pan selon le zoom
    const rect = img.getBoundingClientRect();
    const maxX = Math.max(0, (rect.width  * scale - window.innerWidth)  / 2);
    const maxY = Math.max(0, (rect.height * scale - window.innerHeight) / 2);
    tx = Math.max(-maxX, Math.min(maxX, tx));
    ty = Math.max(-maxY, Math.min(maxY, ty));
  }

  function openLightbox(idx) {
    currentIdx = idx;
    img.src = thumbs[idx].src;
    resetTransform();
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    showHint();
  }

  function closeLightbox() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
    img.src = '';
  }

  function goTo(idx) {
    currentIdx = (idx + thumbs.length) % thumbs.length;
    img.src = thumbs[currentIdx].src;
    resetTransform();
  }

  function showHint() {
    hint.style.opacity = '1';
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { hint.style.opacity = '0'; }, 2500);
  }

  // ── Ouverture depuis les thumbnails
  thumbs.forEach(t => {
    t.addEventListener('click', () => openLightbox(+t.dataset.idx));
  });

  // ── Fermer (bouton ✕ uniquement — le fond ne ferme plus, il zoom)
  btnClose.addEventListener('click', e => { e.stopPropagation(); closeLightbox(); });

  // ── Navigation prev/next
  btnPrev.addEventListener('click', e => { e.stopPropagation(); goTo(currentIdx - 1); });
  btnNext.addEventListener('click', e => { e.stopPropagation(); goTo(currentIdx + 1); });

  // ── Zoom au scroll — centré sur le curseur
  lb.addEventListener('wheel', e => {
    e.preventDefault();

    const delta = e.deltaY < 0 ? 1 : -1;
    const prevScale = scale;
    scale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, scale * (1 + delta * ZOOM_STEP)));

    // Zoom centré sur la position du curseur dans la fenêtre
    const cx = e.clientX - window.innerWidth  / 2;
    const cy = e.clientY - window.innerHeight / 2;
    const scaleRatio = scale / prevScale;
    tx = cx + (tx - cx) * scaleRatio;
    ty = cy + (ty - cy) * scaleRatio;

    if (scale === ZOOM_MIN) { tx = 0; ty = 0; }
    else clampTranslation();

    applyTransform();
  }, { passive: false });

  // ── Pan au drag + clic zoom (distingue drag vs clic via distance)
  let dragMoved = false;
  lb.addEventListener('mousedown', e => {
    if (e.target === btnPrev || e.target === btnNext || e.target === btnClose) return;
    dragging = true;
    dragMoved = false;
    dragStart = { x: e.clientX, y: e.clientY };
    dragOrigin = { tx, ty };
    e.preventDefault();
  });

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
    if (!dragMoved) return;
    tx = dragOrigin.tx + dx;
    ty = dragOrigin.ty + dy;
    clampTranslation();
    applyTransform();
  });

  window.addEventListener('mouseup', e => {
    const wasDragging = dragMoved;
    dragging = false;
    dragMoved = false;
    applyTransform();

    // Si pas de mouvement → c'est un clic
    if (!wasDragging) {
      if (e.target === btnPrev || e.target === btnNext || e.target === btnClose) return;
      // Clic en dehors de l'image → fermer
      const imgRect = img.getBoundingClientRect();
      const outsideImg = e.clientX < imgRect.left || e.clientX > imgRect.right ||
                         e.clientY < imgRect.top  || e.clientY > imgRect.bottom;
      if (outsideImg) { closeLightbox(); return; }
      // Clic sur l'image → zoom ×2 / reset
      const cx = e.clientX - window.innerWidth  / 2;
      const cy = e.clientY - window.innerHeight / 2;
      if (scale > 1) {
        scale = 1; tx = 0; ty = 0;
      } else {
        const prev = scale;
        scale = 2;
        tx = cx + (tx - cx) * (scale / prev);
        ty = cy + (ty - cy) * (scale / prev);
        clampTranslation();
      }
      applyTransform();
    }
  });

  // ── Clavier
  window.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape')      closeLightbox();
    if (e.key === 'ArrowRight')  goTo(currentIdx + 1);
    if (e.key === 'ArrowLeft')   goTo(currentIdx - 1);
    if (e.key === '+')           { scale = Math.min(ZOOM_MAX, scale * 1.2); clampTranslation(); applyTransform(); }
    if (e.key === '-')           { scale = Math.max(ZOOM_MIN, scale / 1.2); if(scale===ZOOM_MIN){tx=0;ty=0;} applyTransform(); }
  });

  // ── Pinch-to-zoom (mobile)
  let lastPinchDist = null;
  lb.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      lastPinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: true });

  lb.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && lastPinchDist) {
      e.preventDefault();
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      scale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, scale * (dist / lastPinchDist)));
      lastPinchDist = dist;
      clampTranslation();
      applyTransform();
    }
  }, { passive: false });

  lb.addEventListener('touchend', () => { lastPinchDist = null; });
</script>
</body>
</html>
