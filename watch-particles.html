<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Montre en particules — maquette</title>
<style>
  html, body { margin:0; padding:0; background:#06080c; overflow-x:hidden;
    font-family:'Helvetica Neue',Arial,sans-serif; }
  .stub { min-height:60vh; display:flex; align-items:center; justify-content:center;
          font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:#3e454f; }
  .stub.top    { background:linear-gradient(180deg,#05070b,#06080c); }
  .stub.bottom { background:linear-gradient(180deg,#06080c,#05070b); }

  #fx-section { position:relative; height:100vh; overflow:hidden;
    background:radial-gradient(80% 85% at 50% 46%, #0e1420 0%, #080b12 55%, #05070b 100%); }
  #fx-canvas { position:absolute; inset:0; z-index:2; }
  #fx-canvas canvas { display:block; }

  /* Typo qui arrive de gauche et de droite, se cale de part et d'autre de la montre */
  .flank { position:absolute; top:50%; z-index:3; pointer-events:none; opacity:0;
    font-weight:200; letter-spacing:.02em; color:#eef2f7; line-height:1.05;
    font-size:clamp(30px,4.6vw,62px); white-space:nowrap; }
  .flank b { font-weight:600; }
  .flank .sub { display:block; font-size:11px; letter-spacing:.4em; text-transform:uppercase;
    color:rgba(220,225,235,.55); margin-top:10px; font-weight:400; }
  #txt-left  { right:63%; text-align:right; }
  #txt-right { left:63%;  text-align:left; }
  .hint { position:absolute; left:50%; bottom:28px; transform:translateX(-50%); z-index:3;
    font-size:10px; letter-spacing:.36em; text-transform:uppercase; color:rgba(220,225,235,.4);
    pointer-events:none; animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.25} 50%{opacity:.7} }
</style>
</head>
<body>
  <div class="stub top">↑ hero / menu — la section est plus bas ↓</div>
  <section id="fx-section">
    <div id="fx-canvas"></div>
    <div class="flank" id="txt-left">Ten<br><b>years.</b></div>
    <div class="flank" id="txt-right">Every<br><b>detail.</b><span class="sub">François Peyranne × Rolex</span></div>
    <div class="hint">scroll</div>
  </section>
  <div class="stub bottom">↓ section « Works »</div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script>
  (function(){
    var _isMob = window.innerWidth <= 768;
    var container = document.getElementById('fx-canvas');
    var txtL = document.getElementById('txt-left'), txtR = document.getElementById('txt-right');
    function cw(){ return container.clientWidth  || window.innerWidth; }
    function ch(){ return container.clientHeight || window.innerHeight; }

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(35, cw()/ch(), 0.1, 100);
    camera.position.set(0,0,12); camera.lookAt(0,0,0);
    var renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
    renderer.setSize(cw(), ch()); renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    container.appendChild(renderer.domElement);
    var FOV_H = Math.tan((35*Math.PI/180)/2)*12;
    function halfW(){ return FOV_H*camera.aspect; }

    function dotTexture(){
      var s=64,c=document.createElement('canvas'); c.width=c.height=s;
      var g=c.getContext('2d'),grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
      grd.addColorStop(0,'rgba(255,255,255,1)'); grd.addColorStop(0.5,'rgba(255,255,255,0.7)');
      grd.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=grd; g.beginPath(); g.arc(s/2,s/2,s/2,0,Math.PI*2); g.fill();
      return new THREE.CanvasTexture(c);
    }

    var SCATTER = 4.6;
    var points, home, scat, cur, vel, hcol, ccol, N=0;
    var pointer={x:1e9,y:1e9,active:false};
    var formP = 0;     // 0 = poussière dispersée ; 1 = montre formée
    var textP = 0;     // 0 = typo hors champ ; 1 = typo calée
    var GOLD=[1.0,0.82,0.46];   // teinte de la poussière quand dispersée

    function build(positions, colors){
      N = positions.length/3; window.__N=N;
      home=new Float32Array(positions); scat=new Float32Array(N*3);
      cur=new Float32Array(N*3); vel=new Float32Array(N*3);
      hcol=new Float32Array(colors); ccol=new Float32Array(colors);
      for (var i=0;i<N;i++){ var ix=i*3;
        var dx=(Math.random()-0.5),dy=(Math.random()-0.5),dz=(Math.random()-0.5);
        var L=Math.hypot(dx,dy,dz)||1, m=0.4+Math.random()*0.9;
        scat[ix]=home[ix]+dx/L*SCATTER*m;
        scat[ix+1]=home[ix+1]+dy/L*SCATTER*m;
        scat[ix+2]=home[ix+2]+dz/L*SCATTER*m*1.5;
        cur[ix]=scat[ix]; cur[ix+1]=scat[ix+1]; cur[ix+2]=scat[ix+2];
      }
      var geo=new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(cur,3));
      geo.setAttribute('color', new THREE.BufferAttribute(ccol,3));
      var mat=new THREE.PointsMaterial({ size:_isMob?0.11:0.09, map:dotTexture(),
        vertexColors:true, transparent:true, opacity:1, depthWrite:false, depthTest:false,
        blending:THREE.NormalBlending, sizeAttenuation:true });
      points=new THREE.Points(geo,mat); scene.add(points);
      setupScroll(); animate();
    }

    function sample(){
      var img=new Image(); img.crossOrigin='anonymous';
      img.onload=function(){
        var W=_isMob?520:1000, H=Math.round(W*img.height/img.width);
        var c=document.createElement('canvas'); c.width=W; c.height=H;
        var g=c.getContext('2d'); g.drawImage(img,0,0,W,H);
        var d; try{ d=g.getImageData(0,0,W,H).data; }catch(e){ console.error(e); return; }
        var step=_isMob?3:2, pos=[], col=[];
        var minx=W,maxx=0,miny=H,maxy=0;
        for (var yy=0;yy<H;yy++){ for (var xx=0;xx<W;xx++){ if(d[(yy*W+xx)*4+3]>60){ if(xx<minx)minx=xx; if(xx>maxx)maxx=xx; if(yy<miny)miny=yy; if(yy>maxy)maxy=yy; } } }
        var bh=(maxy-miny)||1, cxpx=(minx+maxx)/2, cypx=(miny+maxy)/2;
        var targetH=_isMob?4.6:5.8, s=targetH/bh;
        for (var y=0;y<H;y+=step){
          for (var x=0;x<W;x+=step){
            var k=(y*W+x)*4, alpha=d[k+3];
            if (alpha>60){
              var jx=(Math.random()-0.5)*step, jy=(Math.random()-0.5)*step;
              pos.push((x+jx-cxpx)*s, -(y+jy-cypx)*s, (Math.random()-0.5)*0.4);
              var r=d[k]/255,gg=d[k+1]/255,b=d[k+2]/255;
              col.push(Math.min(1,0.30+0.85*r), Math.min(1,0.30+0.85*gg), Math.min(1,0.33+0.88*b));
            }
          }
        }
        if (!pos.length){ console.error('alpha vide ?'); return; }
        build(new Float32Array(pos), new Float32Array(col));
      };
      img.onerror=function(){ console.error('png fail'); };
      img.src='./montre-detour.png';
    }

    function easeOut(t){ t=Math.max(0,Math.min(1,t)); return 1-Math.pow(1-t,3); }

    function setupScroll(){
      gsap.registerPlugin(ScrollTrigger);
      ScrollTrigger.create({ trigger:'#fx-section', start:'center center', end:'+=300%', pin:true, scrub:0.8,
        onUpdate:function(self){
          var p=self.progress;
          // phase 1 (0 -> 0.62) : la poussière converge, LENTEMENT vers la fin (easeOut)
          // phase 2 (0.62 -> 1) : la montre RESTE + la typo arrive de gauche/droite
          formP = easeOut(p/0.62);
          textP = Math.max(0, Math.min(1, (p-0.64)/0.32));
          var off=(1-easeOut(textP))*45;       // vw
          txtL.style.opacity = textP; txtR.style.opacity = textP;
          txtL.style.transform = 'translateY(-50%) translateX(-'+off+'vw)';
          txtR.style.transform = 'translateY(-50%) translateX('+off+'vw)';
        }});
    }

    function onMove(e){
      var r=renderer.domElement.getBoundingClientRect();
      var px=(e.touches?e.touches[0].clientX:e.clientX)-r.left, py=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
      pointer.x=(px/r.width*2-1)*halfW(); pointer.y=-(py/r.height*2-1)*FOV_H; pointer.active=true;
    }
    window.addEventListener('mousemove',onMove);
    window.addEventListener('touchmove',onMove,{passive:true});
    window.addEventListener('mouseout',function(){pointer.active=false;pointer.x=pointer.y=1e9;});

    var R=1.0,R2=R*R,FORCE=0.04,SPRING=0.045,DAMP=0.84, frameCol=0;
    function animate(ts){
      requestAnimationFrame(animate);
      var t=(ts||0)*0.001, f=formP;
      for (var i=0;i<N;i++){ var ix=i*3,iy=ix+1,iz=ix+2;
        var tx=scat[ix]+(home[ix]-scat[ix])*f;
        var ty=scat[iy]+(home[iy]-scat[iy])*f;
        var tz=scat[iz]+(home[iz]-scat[iz])*f;
        var cx=cur[ix],cy=cur[iy],cz=cur[iz];
        if (pointer.active){ var ax=cx-pointer.x,ay=cy-pointer.y,dd=ax*ax+ay*ay;
          if (dd<R2){ var dl=Math.sqrt(dd)+1e-4,ff=(1-dl/R)*FORCE; vel[ix]+=ax/dl*ff; vel[iy]+=ay/dl*ff; } }
        vel[ix]+=(tx-cx)*SPRING; vel[iy]+=(ty-cy)*SPRING; vel[iz]+=(tz-cz)*SPRING;
        vel[ix]*=DAMP; vel[iy]*=DAMP; vel[iz]*=DAMP;
        cur[ix]+=vel[ix]; cur[iy]+=vel[iy]; cur[iz]+=vel[iz];
      }
      points.geometry.attributes.position.needsUpdate=true;
      // couleur : or quand dispersé -> chromie réelle de la montre en se formant (maj allégée 1 frame/2)
      if ((frameCol^=1)===0){
        for (var j=0;j<N;j++){ var jx=j*3;
          ccol[jx]  =GOLD[0]+(hcol[jx]  -GOLD[0])*f;
          ccol[jx+1]=GOLD[1]+(hcol[jx+1]-GOLD[1])*f;
          ccol[jx+2]=GOLD[2]+(hcol[jx+2]-GOLD[2])*f;
        }
        points.geometry.attributes.color.needsUpdate=true;
      }
      points.rotation.y = (1-f)*0.5 + Math.sin(t*0.18)*0.05;
      renderer.render(scene,camera);
    }

    window.addEventListener('resize',function(){
      camera.aspect=cw()/ch(); camera.updateProjectionMatrix(); renderer.setSize(cw(),ch());
    });
    sample();
  })();
  </script>
</body>
</html>
