<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter Expo — Test</title>
  <link rel="stylesheet" href="https://use.typekit.net/xxxxxxx.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ff-display: 'sweet-sans-pro', 'Helvetica Neue', Arial, sans-serif;
      --ink: rgba(11, 17, 22, 0.86);
      --bg: #f4f6f8;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    /* ── Écran plein viewport, centré ── */
    .enter-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /*
      Ratio source : 2048 × 1305
      Le frame adopte la taille maximale qui tient dans le viewport
      en respectant ce ratio — sans déformation.
    */
    .enter-frame {
      position: relative;
      width:  min(100vw, calc(100vh * 2048 / 1305));
      height: min(100vh, calc(100vw * 1305 / 2048));

      /* Hover : zoom très subtil sur l'ensemble */
      transition:
        transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
        filter    0.85s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, filter;
    }
    .enter-frame:hover {
      transform: scale(1.018);
      filter: contrast(1.015) brightness(1.01);
    }

    /* Image de fond — remplit exactement le frame, sans crop */
    .enter-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
      /* Désactive le drag natif sur les images */
      -webkit-user-drag: none;
    }

    /* ── Zones CTA (boutons absolus dans le frame) ── */
    .enter-zone {
      position: absolute;
      display: flex;
      align-items: center;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      z-index: 5;
      transition:
        opacity 0.35s ease,
        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /*
      Positionnement en % du frame 2048×1305
      left/right + top sont des coordonnées relatives à l'image source.
      top: 48.8% ≈ centre vertical de la zone poster dans l'image.
    */
    .enter-zone-left {
      left: 8.7%;
      top: 48.8%;
      transform: translateY(-50%);
      gap: 28px;
    }
    .enter-zone-right {
      right: 8.7%;
      top: 48.8%;
      transform: translateY(-50%);
      gap: 28px;
    }

    /* Hover lateral */
    .enter-zone-left:hover  { transform: translateY(-50%) translateX( 8px); }
    .enter-zone-right:hover { transform: translateY(-50%) translateX(-8px); }

    /* Label typographique */
    .enter-label {
      font-family: var(--ff-display);
      font-size: clamp(9px, 0.75vw, 13px);
      font-weight: 500;
      letter-spacing: 0.46em;
      text-transform: uppercase;
      color: var(--ink);
      white-space: nowrap;
      line-height: 1;
    }

    /* Flèche PNG */
    .enter-arrow {
      display: block;
      width: clamp(40px, 3.8vw, 68px);
      height: auto;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .enter-zone:hover .enter-arrow { transform: scale(1.07); }

    /* Zone cliquable invisible sur le poster central */
    .poster-hotspot {
      position: absolute;
      left:   37.2%;
      top:    13.5%;
      width:  25.6%;
      height: 73%;
      z-index: 4;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    /* Feedback visuel debug — retirer en prod */
    /* .poster-hotspot { background: rgba(255,0,0,0.1); } */
  </style>
</head>
<body>

<section class="enter-screen">
  <div class="enter-frame">

    <!-- Image de fond : CLICKTOENTER_.webp remplit le frame exactement -->
    <img
      class="enter-bg"
      src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CLICKTOENTER_.webp"
      alt="The Rolex Crown Exhibition"
    />

    <!-- CTA gauche : label → flèche droite -->
    <button class="enter-zone enter-zone-left" aria-label="Enter exhibition" onclick="enterExpo()">
      <span class="enter-label">Click to Enter</span>
      <img
        class="enter-arrow"
        src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20DROITE-.png"
        alt=""
      />
    </button>

    <!-- CTA droite : flèche gauche → label -->
    <button class="enter-zone enter-zone-right" aria-label="Enter exhibition" onclick="enterExpo()">
      <img
        class="enter-arrow"
        src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20GAUCHE-.png"
        alt=""
      />
      <span class="enter-label">Click to Enter</span>
    </button>

    <!-- Zone cliquable sur le poster central -->
    <button class="poster-hotspot" aria-label="Enter exhibition" onclick="enterExpo()"></button>

  </div>
</section>

<script>
  function enterExpo() {
    alert('→ enterExpo() appelé');
  }

  // Wireup générique (pour intégration future)
  document.querySelectorAll('.enter-zone, .poster-hotspot').forEach(function(el) {
    el.addEventListener('click', enterExpo);
  });
</script>

</body>
</html>
