<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter Expo — Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ff-display: 'sweet-sans-pro', 'Helvetica Neue', Arial, sans-serif;
      --ink: rgba(11, 17, 22, 0.80);
      --WEBP: url('https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CLICKTOENTER_.webp');
      --ARROW-R: url('https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20GAUCHE-.png');
      --ARROW-L: url('https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20DROITE-.png');
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
    }

    /* ═══════════════════════════════════════════════════
       ÉCRAN — même image en background:cover comble
       les bandes sans blur agressif ni bord blanc
    ═══════════════════════════════════════════════════ */
    .enter-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* Fond = même image, cover. Le centre est toujours visible.
         Légèrement désaturé/lumineux pour ne pas concurrencer le frame. */
      background: var(--WEBP) center / cover no-repeat;
    }
    /* Voile très léger par-dessus le fond pour dépasser le frame */
    .enter-screen::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(240, 241, 243, 0.55);
      backdrop-filter: blur(18px) saturate(0.7);
      -webkit-backdrop-filter: blur(18px) saturate(0.7);
      z-index: 0;
    }

    /* ═══════════════════════════════════════════════════
       FRAME — repère géométrique ratio-locked 2048×1305
    ═══════════════════════════════════════════════════ */
    .enter-frame {
      position: relative;
      z-index: 1;
      width:  min(100vw, calc(100vh * 2048 / 1305));
      height: min(100vh, calc(100vw * 1305 / 2048));
      flex-shrink: 0;
    }

    /* Image fond — aucun crop, ratio respecté */
    .enter-bg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* ═══════════════════════════════════════════════════
       POSTER AREA — zone hover avec zoom
    ═══════════════════════════════════════════════════ */
    .poster-area {
      position: absolute;
      inset: 0;
      /* Le zoom au hover s'applique uniquement à cette zone */
    }
    /* Zone cliquable sur le poster */
    .poster-hotspot {
      position: absolute;
      left:   37.2%;
      top:    13.5%;
      width:  25.6%;
      height: 73%;
      z-index: 4;
      border: 0;
      background: transparent;
      cursor: pointer;
      /* Zoom discret au hover pour inviter à cliquer */
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: center 50%;
    }
    /* Le zoom s'applique à toute l'image via le pseudo sibling trick :
       on agrandit le enter-bg quand le hotspot est survolé. */
    .poster-hotspot:hover {
      transform: scale(1.0); /* hotspot lui-même ne scale pas */
    }
    /* Zoom sur l'image quand le hotspot (ou la frame) est survolé */
    .enter-frame:has(.poster-hotspot:hover) .enter-bg,
    .enter-frame:has(.enter-zone:hover) .enter-bg {
      /* pas de zoom sur les zones CTA */
    }
    /* Zoom sur l'image via wrapper */
    .poster-area {
      overflow: hidden;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    .poster-area:hover {
      transform: scale(1.028);
    }

    /* ═══════════════════════════════════════════════════
       CTAs LATÉRAUX — desktop uniquement
    ═══════════════════════════════════════════════════ */
    .enter-zone {
      position: absolute;
      display: flex;
      align-items: center;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      z-index: 5;
    }

    .enter-zone-left {
      left: 8.2%;
      top: 48.8%;
      transform: translateY(-50%);
      gap: 24px;
      animation: slideInLeft 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
    }
    .enter-zone-right {
      right: 8.2%;
      top: 48.8%;
      transform: translateY(-50%);
      gap: 24px;
      animation: slideInRight 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateY(-50%) translateX(-52px); }
      to   { opacity: 1; transform: translateY(-50%) translateX(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateY(-50%) translateX(52px); }
      to   { opacity: 1; transform: translateY(-50%) translateX(0); }
    }

    .enter-label {
      font-family: var(--ff-display);
      font-size: clamp(9px, 0.72vw, 13px);
      font-weight: 500;
      letter-spacing: 0.48em;
      text-transform: uppercase;
      color: var(--ink);
      white-space: nowrap;
      line-height: 1;
    }

    /* Flèches — pas d'interaction hover, pulse permanent vers le poster */
    .enter-arrow {
      display: block;
      width: clamp(44px, 4.2vw, 76px);
      height: auto;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
      flex-shrink: 0;
    }

    .enter-zone-left  .enter-arrow { animation: pulseRight 2.2s ease-in-out infinite; }
    .enter-zone-right .enter-arrow { animation: pulseLeft  2.2s ease-in-out infinite; }

    @keyframes pulseRight {
      0%, 100% { transform: translateX(0);   opacity: 0.5; }
      50%       { transform: translateX(9px); opacity: 1; }
    }
    @keyframes pulseLeft {
      0%, 100% { transform: translateX(0);    opacity: 0.5; }
      50%       { transform: translateX(-9px); opacity: 1; }
    }

    /* ═══════════════════════════════════════════════════
       CTA MOBILE — sous le frame, affiché < 680px
    ═══════════════════════════════════════════════════ */
    .mobile-cta {
      display: none; /* caché sur desktop */
      z-index: 2;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 22px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mobile-cta .enter-label {
      font-size: 9px;
      letter-spacing: 0.42em;
    }
    .mobile-cta .enter-arrow {
      width: 32px;
    }
    /* Arrow gauche → pointe vers le texte (vers le centre) */
    .mobile-cta .arrow-left  { animation: pulseRight 2.2s ease-in-out infinite; }
    /* Arrow droite → pointe vers le texte (vers le centre) */
    .mobile-cta .arrow-right { animation: pulseLeft  2.2s ease-in-out infinite; }

    /* ═══════════════════════════════════════════════════
       RESPONSIVE — < 680px : layout vertical
    ═══════════════════════════════════════════════════ */
    @media (max-width: 680px) {
      .enter-screen {
        justify-content: center;
        gap: 0;
      }

      /* Sur mobile, le frame prend toute la largeur dispo */
      .enter-frame {
        width: 94vw;
        height: calc(94vw * 1305 / 2048);
      }

      /* CTAs latéraux cachés */
      .enter-zone-left,
      .enter-zone-right {
        display: none;
      }

      /* CTA mobile visible */
      .mobile-cta {
        display: flex;
      }
    }

    /* Très petit écran : frame encore plus compact */
    @media (max-width: 400px) {
      .enter-frame {
        width: 98vw;
        height: calc(98vw * 1305 / 2048);
      }
      .mobile-cta { margin-top: 14px; }
    }
  </style>
</head>
<body>

<section class="enter-screen">

  <div class="enter-frame">

    <!-- poster-area gère le hover zoom sur l'image -->
    <div class="poster-area">
      <img
        class="enter-bg"
        src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CLICKTOENTER_.webp"
        alt="The Rolex Crown Exhibition"
      />
      <!-- Zone cliquable invisible sur le poster central -->
      <button class="poster-hotspot" aria-label="Enter exhibition"></button>
    </div>

    <!-- CTA gauche : texte → flèche pointant vers le poster -->
    <button class="enter-zone enter-zone-left" aria-label="Enter exhibition">
      <span class="enter-label">Click to Enter</span>
      <img
        class="enter-arrow"
        src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20GAUCHE-.png"
        alt=""
      />
    </button>

    <!-- CTA droite : flèche pointant vers le poster → texte -->
    <button class="enter-zone enter-zone-right" aria-label="Enter exhibition">
      <img
        class="enter-arrow"
        src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20DROITE-.png"
        alt=""
      />
      <span class="enter-label">Click to Enter</span>
    </button>

  </div>

  <!-- CTA mobile : sous le frame, visible uniquement < 680px -->
  <div class="mobile-cta">
    <img
      class="enter-arrow arrow-left"
      src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20GAUCHE-.png"
      alt=""
    />
    <span class="enter-label">Click to Enter</span>
    <img
      class="enter-arrow arrow-right"
      src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20DROITE-.png"
      alt=""
    />
  </div>

</section>

<script>
  function enterExpo() {
    alert('→ enterExpo()');
  }
  document.querySelectorAll('.enter-zone, .poster-hotspot, .mobile-cta').forEach(function(el) {
    el.addEventListener('click', enterExpo);
  });
</script>

</body>
</html>
