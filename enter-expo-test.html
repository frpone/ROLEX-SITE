<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter Expo — Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ff-display: 'sweet-sans-pro', 'Helvetica Neue', Arial, sans-serif;
      --ink: rgba(11, 17, 22, 0.80);
    }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    /* ── Fond atmosphérique : CLICKTOENTER_.webp en cover ──────────────
       Remplit le viewport sans blanc. Le centre (atmosphère + couronne)
       reste toujours visible. */
    .enter-screen {
      position: fixed;
      inset: 0;
      background:
        url('https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CLICKTOENTER_.webp')
        center / cover no-repeat;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 4vw, 64px);
      padding: 24px clamp(16px, 4vw, 48px);
    }

    /* ── Affiche seule : AFFICHE TITRE .webp ───────────────────────────
       Portrait, taille pilotée par la hauteur du viewport sur desktop,
       par la largeur sur mobile. */
    .poster-wrapper {
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
      /* Zoom uniquement sur l'affiche au hover */
      cursor: pointer;
    }
    .poster-img {
      display: block;
      height: min(82vh, 55vw);   /* desktop : hauteur-driven */
      width: auto;
      user-select: none;
      pointer-events: none;
      -webkit-user-drag: none;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    .poster-wrapper:hover .poster-img {
      transform: scale(1.028);
    }

    /* ── CTAs latéraux (desktop) ────────────────────────────────────── */
    .enter-zone {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: clamp(14px, 2vw, 28px);
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .enter-zone-left  { animation: slideInLeft  0.9s cubic-bezier(0.22,1,0.36,1) 0.25s both; }
    .enter-zone-right { animation: slideInRight 0.9s cubic-bezier(0.22,1,0.36,1) 0.25s both; }

    @keyframes slideInLeft  {
      from { opacity:0; transform: translateX(-44px); }
      to   { opacity:1; transform: translateX(0); }
    }
    @keyframes slideInRight {
      from { opacity:0; transform: translateX(44px); }
      to   { opacity:1; transform: translateX(0); }
    }

    .enter-label {
      font-family: var(--ff-display);
      font-size: clamp(8px, 0.68vw, 12px);
      font-weight: 500;
      letter-spacing: 0.46em;
      text-transform: uppercase;
      color: var(--ink);
      white-space: nowrap;
      line-height: 1;
    }

    /* Flèches PNG — pulse permanent vers le poster, aucun hover */
    .enter-arrow {
      display: block;
      width: clamp(38px, 3.8vw, 68px);
      height: auto;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      flex-shrink: 0;
    }
    .enter-zone-left  .enter-arrow { animation: pulseRight 2.2s ease-in-out infinite; }
    .enter-zone-right .enter-arrow { animation: pulseLeft  2.2s ease-in-out infinite; }

    @keyframes pulseRight {
      0%,100% { transform: translateX(0);   opacity: 0.5; }
      50%      { transform: translateX(8px); opacity: 1; }
    }
    @keyframes pulseLeft {
      0%,100% { transform: translateX(0);    opacity: 0.5; }
      50%      { transform: translateX(-8px); opacity: 1; }
    }

    /* ── Responsive mobile < 640px ─────────────────────────────────────
       Layout vertical : affiche large, CTA centré en dessous. */
    @media (max-width: 640px) {
      .enter-screen {
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        padding: 20px 16px;
      }

      /* Affiche : pilotée par la largeur */
      .poster-img {
        height: auto;
        width: min(82vw, 340px);
      }

      /* CTAs latéraux cachés */
      .enter-zone-left,
      .enter-zone-right { display: none; }

      /* CTA mobile centré */
      .mobile-cta { display: flex; }
    }

    /* ── CTA mobile : caché sur desktop ───────────────────────────────  */
    .mobile-cta {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mobile-cta .enter-label { font-size: 9px; letter-spacing: 0.44em; }
    .mobile-cta .enter-arrow { width: 30px; }
    .mobile-cta .arrow-l { animation: pulseRight 2.2s ease-in-out infinite; }
    .mobile-cta .arrow-r { animation: pulseLeft  2.2s ease-in-out infinite; }
  </style>
</head>
<body>

<section class="enter-screen">

  <!-- CTA gauche : label → flèche (pointe vers l'affiche) -->
  <button class="enter-zone enter-zone-left" aria-label="Enter exhibition">
    <span class="enter-label">Click to Enter</span>
    <img class="enter-arrow"
      src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20GAUCHE-.png"
      alt="" />
  </button>

  <!-- Affiche seule — hover zoom uniquement ici -->
  <div class="poster-wrapper">
    <img class="poster-img"
      src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/AFFICHE%20TITRE%20.webp"
      alt="Rolex Crown Exhibition — François Peyranne" />
  </div>

  <!-- CTA droite : flèche (pointe vers l'affiche) → label -->
  <button class="enter-zone enter-zone-right" aria-label="Enter exhibition">
    <img class="enter-arrow"
      src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20DROITE-.png"
      alt="" />
    <span class="enter-label">Click to Enter</span>
  </button>

  <!-- CTA mobile : visible < 640px seulement -->
  <div class="mobile-cta">
    <img class="enter-arrow arrow-l"
      src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20GAUCHE-.png"
      alt="" />
    <span class="enter-label">Click to Enter</span>
    <img class="enter-arrow arrow-r"
      src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20DROITE-.png"
      alt="" />
  </div>

</section>

<script>
  function enterExpo() { alert('→ enterExpo()'); }

  document.querySelectorAll(
    '.enter-zone, .poster-wrapper, .mobile-cta'
  ).forEach(function(el) {
    el.addEventListener('click', enterExpo);
  });
</script>

</body>
</html>
