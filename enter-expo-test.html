<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter Expo — Test</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ff-display: 'sweet-sans-pro', 'Helvetica Neue', Arial, sans-serif;
      --ink: rgba(11, 17, 22, 0.78);
      --ink-soft: rgba(11, 17, 22, 0.42);

      /* URLs assets */
      --url-poster:   'https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/AFFICHE%20TITRE%2Bcadre%20.webp';
      --url-arrow-r:  'https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20GAUCHE-.png';
      --url-arrow-l:  'https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20DROITE-.png';
    }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    /* ═══════════════════════════════════════════════════════
       FOND — recréé en CSS pur, cool grey atmosphérique.
       Gradient radial : centre plus clair, bords plus foncés.
       Aucune image de fond → aucun problème de ratio.
    ═══════════════════════════════════════════════════════ */
    .enter-screen {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(
          ellipse 90% 80% at 50% 44%,
          #f4f5f7 0%,
          #e0e3e8 55%,
          #cdd2d9 100%
        );
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 4.5vw, 72px);
      padding: 0 clamp(16px, 5vw, 56px);
      overflow: hidden;
    }

    /* ═══════════════════════════════════════════════════════
       BLOC AFFICHE — regroupe poster + subtitle.
       Subtitle est à l'intérieur → se déplace et scale
       exactement avec l'affiche.
    ═══════════════════════════════════════════════════════ */
    .poster-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      flex-shrink: 0;
      cursor: pointer;
      /* Entrée depuis le bas */
      animation: riseIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* CTA mobile au-dessus — caché sur desktop */
    .cta-above {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    /* ── Wrapper poster : le scale s'applique ici → cadre + image
       zooment ensemble. Pas d'overflow:hidden → le cadre est visible
       dans sa totalité pendant le zoom. ── */
    .poster-wrap {
      /* Ombre portée douce sous le cadre */
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.12),
        0 32px 72px rgba(0, 0, 0, 0.10);
      flex-shrink: 0;
      transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      transform-origin: center bottom;
    }
    .poster-wrap:hover {
      transform: scale(1.032);
      box-shadow:
        0 18px 48px rgba(0, 0, 0, 0.14),
        0 44px 96px rgba(0, 0, 0, 0.11);
    }

    .poster-img {
      display: block;
      /* Desktop : hauteur pilotée. Mobile override en media query. */
      height: min(84vh, 54vw);
      width: auto;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Subtitle — locké dans le bloc, scale avec lui */
    .poster-subtitle {
      font-family: var(--ff-display);
      font-size: clamp(7px, 0.58vw, 10px);
      font-weight: 400;
      letter-spacing: 0.40em;
      text-transform: uppercase;
      color: var(--ink-soft);
      white-space: nowrap;
      line-height: 1;
      text-align: center;
    }

    /* ═══════════════════════════════════════════════════════
       CTAs LATÉRAUX — desktop uniquement
    ═══════════════════════════════════════════════════════ */
    .enter-zone {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: clamp(12px, 1.8vw, 26px);
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .enter-zone-left  { animation: slideInLeft  0.9s cubic-bezier(0.22,1,0.36,1) 0.4s both; }
    .enter-zone-right { animation: slideInRight 0.9s cubic-bezier(0.22,1,0.36,1) 0.4s both; }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-44px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(44px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .enter-label {
      font-family: var(--ff-display);
      font-size: clamp(8px, 0.65vw, 12px);
      font-weight: 500;
      letter-spacing: 0.46em;
      text-transform: uppercase;
      color: var(--ink);
      white-space: nowrap;
      line-height: 1;
    }

    /* Flèches PNG — pulse permanent vers l'affiche, sans hover */
    .enter-arrow {
      display: block;
      width: clamp(54px, 5.4vw, 96px);
      height: auto;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      flex-shrink: 0;
    }

    /* Gauche → flèche pointe vers l'affiche (droite) */
    .enter-zone-left  .enter-arrow { animation: pulseRight 2.2s ease-in-out infinite; }
    /* Droite → flèche pointe vers l'affiche (gauche) */
    .enter-zone-right .enter-arrow { animation: pulseLeft  2.2s ease-in-out infinite; }

    @keyframes pulseRight {
      0%,100% { transform: translateX(0);   opacity: 0.50; }
      50%      { transform: translateX(8px); opacity: 1; }
    }
    @keyframes pulseLeft {
      0%,100% { transform: translateX(0);    opacity: 0.50; }
      50%      { transform: translateX(-8px); opacity: 1; }
    }

    /* ═══════════════════════════════════════════════════════
       MOBILE ≤ 640px
       Layout : CTA au-dessus (flèche vers le bas) + affiche
    ═══════════════════════════════════════════════════════ */
    @media (max-width: 640px) {

      .enter-screen {
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        padding: 16px;
      }

      /* CTAs latéraux cachés */
      .enter-zone-left,
      .enter-zone-right { display: none; }

      /* Affiche plus large sur mobile */
      .poster-img {
        height: auto;
        width: min(78vw, 320px);
      }

      /* Subtitle scale avec l'affiche */
      .poster-subtitle {
        font-size: clamp(7px, 2vw, 10px);
      }

      /* CTA au-dessus visible */
      .cta-above {
        display: flex;
        animation: slideInTop 0.9s cubic-bezier(0.22,1,0.36,1) 0.35s both;
      }

      @keyframes slideInTop {
        from { opacity: 0; transform: translateY(-28px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .cta-above .enter-label {
        font-size: 9px;
        letter-spacing: 0.42em;
        color: var(--ink);
      }

      /* CROIX GAUCHE (→) rotée 90° = pointe vers le bas (↓) */
      .cta-above .enter-arrow {
        width: clamp(32px, 8vw, 48px);
        animation: pulseDown 2.2s ease-in-out infinite;
      }

      @keyframes pulseDown {
        /*
          rotate(90deg) d'abord, puis translateX(8px) dans
          le repère rotaté → 8px vers le bas en screen space.
        */
        0%,100% { transform: rotate(90deg) translateX(0);   opacity: 0.50; }
        50%      { transform: rotate(90deg) translateX(8px); opacity: 1; }
      }
    }
  </style>
</head>
<body>

<section class="enter-screen">

  <!-- CTA gauche (desktop) -->
  <button class="enter-zone enter-zone-left" aria-label="Enter exhibition">
    <span class="enter-label">Click to Enter</span>
    <img class="enter-arrow"
      src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20GAUCHE-.png"
      alt="" />
  </button>

  <!-- Bloc central : CTA mobile + poster + subtitle -->
  <div class="poster-block">

    <!-- CTA mobile au-dessus : arrow down + texte -->
    <div class="cta-above">
      <span class="enter-label">Click to Enter</span>
      <!-- CROIX GAUCHE (→) → rotate(90deg) = ↓ -->
      <img class="enter-arrow"
        src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20GAUCHE-.png"
        alt="" />
    </div>

    <!-- Affiche avec cadre — zoom uniquement ici -->
    <div class="poster-wrap">
      <img class="poster-img"
        src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/AFFICHE%20TITRE%2Bcadre%20.webp"
        alt="Rolex Crown Exhibition — François Peyranne" />
    </div>

    <!-- Subtitle locké dans le bloc, scale avec l'affiche -->
    <p class="poster-subtitle">The Rolex Crown Exhibiton</p>

  </div>

  <!-- CTA droite (desktop) -->
  <button class="enter-zone enter-zone-right" aria-label="Enter exhibition">
    <img class="enter-arrow"
      src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/CROIX%20DROITE-.png"
      alt="" />
    <span class="enter-label">Click to Enter</span>
  </button>

</section>

<script>
  function enterExpo() { alert('→ enterExpo()'); }

  document.querySelectorAll(
    '.enter-zone, .poster-wrap, .poster-block, .cta-above'
  ).forEach(function(el) {
    el.addEventListener('click', enterExpo);
  });
</script>

</body>
</html>
