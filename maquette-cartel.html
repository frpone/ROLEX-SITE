<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maquette — Cartel : Serif vs Sans</title>
<link rel="preconnect" href="https://use.typekit.net" />
<link rel="stylesheet" href="https://use.typekit.net/fqu8chv.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{ --ff:'sweet-sans-pro','Helvetica Neue',Arial,sans-serif; --serif:'Cormorant Garamond',serif; --gold:#c2a161; }
  body{ background:rgba(0,0,0,0.96); min-height:100vh; font-family:var(--ff); color:#fff; overflow:hidden; }

  #poster{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding-right:18vw; }
  #poster img{ max-height:88vh; max-width:54vw; box-shadow:0 30px 90px rgba(0,0,0,.6); }

  #picker{ position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:50; display:flex; gap:8px; }
  #picker button{ font-family:var(--ff); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#bbb;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:8px 16px; cursor:pointer; transition:.2s; }
  #picker button.on{ background:#fff; color:#0b0b0c; border-color:#fff; }

  #cartel{ position:fixed; right:5%; top:50%; transform:translateY(-50%); width:min(300px,25vw); text-align:left; z-index:40; }
  .rule{ width:38px; height:1px; background:var(--gold); margin:22px 0 16px; }
  .specs{ font-family:var(--ff); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:rgba(255,255,255,.5); line-height:2; }
  .copy{ font-family:var(--ff); font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); margin-top:20px; }

  /* ---- SERIF (actuel) ---- */
  body[data-type="serif"] .t{ font-family:var(--serif); font-style:italic; font-weight:500; font-size:30px; line-height:1.08; color:#fff; }
  body[data-type="serif"] .sub{ font-family:var(--serif); font-style:italic; font-weight:400; font-size:16.5px; line-height:1.5; color:rgba(255,255,255,.74); margin-top:13px; }

  /* ---- SANS (bâton, graphique) ---- */
  body[data-type="sans"] .t{ font-family:var(--ff); font-weight:700; font-size:21px; line-height:1.18; letter-spacing:.06em; text-transform:uppercase; color:#fff; }
  body[data-type="sans"] .sub{ font-family:var(--ff); font-weight:300; font-size:13px; line-height:1.7; letter-spacing:.015em; color:rgba(255,255,255,.6); margin-top:15px; }
</style>
</head>
<body data-type="sans">

  <div id="poster"><img src="AFFICHES_JPEG_SITE/DYPTIQUE_001_HD_B.webp" alt="" /></div>

  <div id="cartel">
    <div class="t">Cosmograph Daytona — Engine of Time</div>
    <div class="sub">A dynamic interpretation of the crown as a symbol of speed, force and mechanical precision.</div>
    <div class="rule"></div>
    <div class="specs">100 × 140 cm<br>Tirage Lambda contrecollé sous Diasec</div>
    <div class="copy">© François Peyranne</div>
  </div>

  <div id="picker">
    <button data-t="sans" class="on">Sans (bâton)</button>
    <button data-t="serif">Serif (italique)</button>
  </div>

  <script>
    var btns=[].slice.call(document.querySelectorAll('#picker button'));
    btns.forEach(function(b){ b.addEventListener('click',function(){
      document.body.setAttribute('data-type', b.getAttribute('data-t'));
      btns.forEach(function(x){x.classList.toggle('on', x===b);});
    });});
  </script>
</body>
</html>
