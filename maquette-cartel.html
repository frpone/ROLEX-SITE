<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maquette — Cartel d'affiche (version retenue)</title>
<link rel="preconnect" href="https://use.typekit.net" />
<link rel="stylesheet" href="https://use.typekit.net/fqu8chv.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{ --ff:'sweet-sans-pro','Helvetica Neue',Arial,sans-serif; --serif:'Cormorant Garamond',serif; --gold:#c2a161; }
  body{ background:rgba(0,0,0,0.96); min-height:100vh; font-family:var(--ff); color:#fff; overflow:hidden; }

  /* affiche centrée (simulation lightbox) — laisse une marge à droite pour le cartel */
  #poster{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding-right:18vw; }
  #poster img{ max-height:88vh; max-width:54vw; box-shadow:0 30px 90px rgba(0,0,0,.6); }

  /* ── Cartel : panneau à droite, sans cadre, typo Cormorant ── */
  #cartel{
    position:fixed; right:5%; top:50%; transform:translateY(-50%);
    width:min(290px, 24vw); text-align:left; z-index:40;
  }
  #cartel .t{
    font-family:var(--serif); font-style:italic; font-weight:500;
    font-size:30px; line-height:1.08; color:#fff;
  }
  #cartel .sub{
    font-family:var(--serif); font-style:italic; font-weight:400;
    font-size:16.5px; line-height:1.5; color:rgba(255,255,255,.74); margin-top:13px;
  }
  #cartel .rule{ width:38px; height:1px; background:var(--gold); margin:22px 0 16px; }
  #cartel .specs{
    font-family:var(--ff); font-size:10px; font-weight:400;
    letter-spacing:.24em; text-transform:uppercase; color:rgba(255,255,255,.5); line-height:2;
  }
  #cartel .copy{
    font-family:var(--ff); font-size:10px; font-weight:400;
    letter-spacing:.22em; text-transform:uppercase; color:var(--gold); margin-top:20px;
  }
</style>
</head>
<body>

  <div id="poster"><img src="AFFICHES_JPEG_SITE/DYPTIQUE_001_HD_B.webp" alt="" /></div>

  <div id="cartel">
    <div class="t">Cosmograph Daytona — Engine of Time</div>
    <div class="sub">A dynamic interpretation of the crown as a symbol of speed, force and mechanical precision.</div>
    <div class="rule"></div>
    <div class="specs">100 × 140 cm<br>Tirage Lambda contrecollé sous Diasec</div>
    <div class="copy">© François Peyranne</div>
  </div>

</body>
</html>
