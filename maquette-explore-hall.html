<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ff-display: 'sweet-sans-pro','Helvetica Neue',sans-serif; --ff-serif: 'Cormorant Garamond', serif; --gold:#b69256; }
  html, body { height: 100%; }
  body {
    font-family: var(--ff-display);
    background:
      radial-gradient(ellipse 90% 70% at 50% 0%, #15151a 0%, #0a0a0c 60%, #060608 100%);
    color: #eceae6;
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 5vh 0 6vh;
    overflow-x: hidden;
  }

  /* En-tête */
  header { text-align: center; padding: 0 24px; margin-bottom: clamp(28px, 4vh, 52px); }
  .crown { width: clamp(34px, 3vw, 46px); height: auto; opacity: .95; margin: 0 auto 18px; display:block; }
  .eyebrow {
    font-size: clamp(10px, .8vw, 12px); letter-spacing: .42em; text-transform: uppercase;
    color: var(--gold); display: inline-flex; align-items: center; gap: 14px; margin-bottom: 18px;
  }
  .eyebrow::before, .eyebrow::after { content:''; width: 26px; height:1px; background: rgba(182,146,86,.6); }
  h1 { font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: clamp(22px, 3vw, 40px); line-height: 1.05; }
  h1 .it { font-family: var(--ff-serif); font-style: italic; font-weight: 400; text-transform: none; letter-spacing: .01em; }
  .sub { margin-top: 16px; font-size: clamp(12px, 1vw, 15px); color: rgba(236,234,230,.5); font-weight: 300; letter-spacing: .02em; }

  /* Chemin de fer */
  .strip {
    display: flex; gap: clamp(14px, 1.6vw, 26px);
    padding: 10px clamp(24px, 6vw, 96px);
    overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .strip::-webkit-scrollbar { display: none; }

  .card {
    position: relative; flex: 0 0 auto;
    width: clamp(230px, 24vw, 340px); aspect-ratio: 16 / 10;
    border-radius: 4px; overflow: hidden; text-decoration: none;
    scroll-snap-align: center;
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 18px 50px rgba(0,0,0,.5);
    transition: transform .45s cubic-bezier(.22,1,.36,1), border-color .3s, box-shadow .3s;
  }
  .thumb { position:absolute; inset:0; }
  .thumb img { width:100%; height:100%; object-fit: cover; display:block; filter: saturate(1.02) brightness(.94); transition: transform .6s cubic-bezier(.22,1,.36,1), filter .3s; }
  .card-grad { position:absolute; inset:0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.62) 100%); }
  .card-meta { position:absolute; left:0; right:0; bottom:0; padding: 16px 18px; display:flex; align-items:flex-end; justify-content: space-between; }
  .num { font-family: var(--ff-serif); font-style: italic; font-size: clamp(26px, 2.4vw, 38px); line-height:.9; color:#fff; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  .enter { font-size: 9.5px; letter-spacing: .28em; text-transform: uppercase; color: rgba(255,255,255,.0); transition: color .3s; }

  .card:hover { transform: translateY(-6px); border-color: var(--gold); box-shadow: 0 26px 70px rgba(0,0,0,.6); }
  .card:hover .thumb img { transform: scale(1.06); filter: saturate(1.06) brightness(1); }
  .card:hover .enter { color: var(--gold); }

  /* Dots */
  .dots { display:flex; gap: 9px; justify-content:center; margin-top: clamp(22px, 3.5vh, 40px); }
  .dot { width:6px; height:6px; border-radius:50%; background: rgba(255,255,255,.20); transition: all .3s; }
  .dot.on { background: var(--gold); transform: scale(1.25); }

  .hint { text-align:center; margin-top: 18px; font-size: 10px; letter-spacing:.24em; text-transform:uppercase; color: rgba(236,234,230,.28); }
</style>
</head>

  <script>
    // dots suivent le scroll (mockup)
    var strip = document.querySelector('.strip');
    var dots = [].slice.call(document.querySelectorAll('.dot'));
    var cards = [].slice.call(document.querySelectorAll('.card'));
    strip.addEventListener('scroll', function(){
      var mid = strip.scrollLeft + strip.clientWidth/2;
      var best=0, bd=1e9;
      cards.forEach(function(c,i){ var x=c.offsetLeft + c.offsetWidth/2; var dd=Math.abs(x-mid); if(dd<bd){bd=dd;best=i;} });
      dots.forEach(function(d,i){ d.classList.toggle('on', i===best); });
    });
  </script>
