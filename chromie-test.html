<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromie Test — Affiche vs Canvas</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', sans-serif; background: #1a1a1a; color: #fff; }

  h1 { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; padding: 16px 24px; opacity: 0.5; font-weight: 400; }

  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: calc(100vh - 48px);
    gap: 2px;
  }

  .panel {
    position: relative;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  .label {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 9px; letter-spacing: 0.35em; text-transform: uppercase;
    background: rgba(0,0,0,0.55); color: #fff; padding: 5px 12px; border-radius: 2px;
    white-space: nowrap; z-index: 10; pointer-events: none;
  }

  /* ── Panel gauche : section affiche (cool grey CSS) ── */
  #panel-affiche {
    background: radial-gradient(
      ellipse 90% 80% at 50% 44%,
      #f4f5f7 0%,
      #e0e3e8 55%,
      #cdd2d9 100%
    );
  }
  #affiche-img {
    max-height: 75%; max-width: 55%;
    object-fit: contain;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  }

  /* ── Panel droit : canvas frame_069 ── */
  #panel-canvas { background: #000; }
  #test-canvas { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ── Contrôles en bas ── */
  .controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(15,15,15,0.95);
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 14px 24px;
    display: flex; align-items: center; gap: 32px; flex-wrap: wrap;
  }
  .ctrl-group {
    display: flex; align-items: center; gap: 10px;
  }
  .ctrl-group label {
    font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.55; width: 80px;
  }
  .ctrl-group input[type=range] {
    width: 140px; accent-color: #aaa;
  }
  .ctrl-group .val {
    font-size: 10px; font-family: monospace; opacity: 0.8; width: 36px;
  }
  #filter-display {
    font-size: 9px; font-family: monospace; color: #7af;
    margin-left: auto; opacity: 0.8;
  }
  button.preset {
    font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; padding: 5px 12px; cursor: pointer; border-radius: 2px;
  }
  button.preset:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>

<h1>Chromie Test — Affiche (gauche) vs Canvas frame 069 (droite)</h1>

<div class="panels">
  <!-- Gauche : section affiche telle quelle dans le site -->
  <div class="panel" id="panel-affiche">
    <div class="label">Section affiche — CSS tel quel</div>
    <img id="affiche-img"
      src="https://raw.githubusercontent.com/frpone/ROLEX-SITE/main/AFFICHES_JPEG_SITE/TRYPTIQUE_003_HD_B_.webp"
      alt="Affiche B" />
  </div>

  <!-- Droite : frame_069 avec filtre CSS ajustable -->
  <div class="panel" id="panel-canvas">
    <div class="label" id="canvas-label">Canvas frame 069 — filtre live</div>
    <canvas id="test-canvas"></canvas>
  </div>
</div>

<div class="controls">
  <div class="ctrl-group">
    <label>Saturate</label>
    <input type="range" id="sl-sat" min="0" max="1" step="0.01" value="0.45">
    <span class="val" id="v-sat">0.45</span>
  </div>
  <div class="ctrl-group">
    <label>Brightness</label>
    <input type="range" id="sl-bri" min="0.7" max="1.3" step="0.01" value="0.98">
    <span class="val" id="v-bri">0.98</span>
  </div>
  <div class="ctrl-group">
    <label>Contrast</label>
    <input type="range" id="sl-con" min="0.7" max="1.3" step="0.01" value="0.93">
    <span class="val" id="v-con">0.93</span>
  </div>
  <div class="ctrl-group">
    <label>Hue-rotate</label>
    <input type="range" id="sl-hue" min="-30" max="30" step="1" value="0">
    <span class="val" id="v-hue">0°</span>
  </div>

  <button class="preset" onclick="setPreset(0.80,1.02,0.96,0)">Original</button>
  <button class="preset" onclick="setPreset(0.45,0.98,0.93,0)">Actuel site</button>
  <button class="preset" onclick="setPreset(0.55,0.99,0.94,0)">Intermédiaire</button>
  <button class="preset" onclick="setPreset(0.30,0.96,0.90,5)">Très froid</button>

  <span id="filter-display">filter: ...</span>
</div>

<script>
  var canvas = document.getElementById('test-canvas');
  var ctx = canvas.getContext('2d');
  var img = new Image();
  img.crossOrigin = 'anonymous';

  // Resize canvas to match its CSS display size
  function resizeCanvas() {
    var panel = document.getElementById('panel-canvas');
    canvas.width  = panel.clientWidth;
    canvas.height = panel.clientHeight;
    if (img.naturalWidth) drawFrame();
  }
  window.addEventListener('resize', resizeCanvas);

  function drawFrame() {
    var cw = canvas.width, ch = canvas.height;
    var iw = img.naturalWidth, ih = img.naturalHeight;
    if (!iw) return;
    var scale = Math.max(cw / iw, ch / ih);
    var dw = iw * scale, dh = ih * scale;
    var dx = (cw - dw) / 2, dy = (ch - dh) / 2;
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  img.onload = function() {
    resizeCanvas();
    drawFrame();
    applyFilter();
  };
  // Charge frame_069
  img.src = './FRAMES_INTRO2/frame_069.jpg';

  // Sliders
  var sliders = [
    { id: 'sl-sat', valId: 'v-sat', suffix: '',  prop: 'sat' },
    { id: 'sl-bri', valId: 'v-bri', suffix: '',  prop: 'bri' },
    { id: 'sl-con', valId: 'v-con', suffix: '',  prop: 'con' },
    { id: 'sl-hue', valId: 'v-hue', suffix: '°', prop: 'hue' },
  ];
  sliders.forEach(function(s) {
    document.getElementById(s.id).addEventListener('input', function() {
      document.getElementById(s.valId).textContent = this.value + s.suffix;
      applyFilter();
    });
  });

  function getVal(id) { return parseFloat(document.getElementById(id).value); }

  function applyFilter() {
    var sat = getVal('sl-sat');
    var bri = getVal('sl-bri');
    var con = getVal('sl-con');
    var hue = getVal('sl-hue');
    var f = 'saturate(' + sat + ') brightness(' + bri + ') contrast(' + con + ')' + (hue !== 0 ? ' hue-rotate(' + hue + 'deg)' : '');
    canvas.style.filter = f;
    document.getElementById('filter-display').textContent = 'filter: ' + f;
  }

  function setPreset(sat, bri, con, hue) {
    document.getElementById('sl-sat').value = sat;
    document.getElementById('sl-bri').value = bri;
    document.getElementById('sl-con').value = con;
    document.getElementById('sl-hue').value = hue;
    document.getElementById('v-sat').textContent = sat;
    document.getElementById('v-bri').textContent = bri;
    document.getElementById('v-con').textContent = con;
    document.getElementById('v-hue').textContent = hue + '°';
    applyFilter();
  }

  applyFilter();
</script>
</body>
</html>
